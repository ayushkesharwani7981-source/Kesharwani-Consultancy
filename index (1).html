const grid = document.getElementById("addressGrid");


/* CREATE ALL BOXES */

addresses.forEach((address) => {

    const box = document.createElement("div");

    box.className = "box";

    box.innerHTML = address.html;

    box.onclick = function () {
        copyAddress(this, address.copy);
    };

    grid.appendChild(box);

});


/* COPY */

function copyAddress(box, text) {

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(text)
            .then(() => showCopied(box))
            .catch(() => fallbackCopy(box, text));

    } else {

        fallbackCopy(box, text);

    }

}


/* FALLBACK COPY */

function fallbackCopy(box, text) {

    const textarea = document.createElement("textarea");

    textarea.value = text;

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);

    try {

        document.execCommand("copy");

        showCopied(box);

    } catch (error) {

        alert("Copy failed. Please try again.");

    }

    document.body.removeChild(textarea);

}


/* COPIED MESSAGE */

function showCopied(box) {

    const original = box.innerHTML;

    box.innerHTML = `
        <div style="
            text-align:center;
            font-size:18px;
            font-weight:700;
            padding:30px 5px;
        ">
            ✓ Copied
        </div>
    `;

    box.classList.add("copied");


    setTimeout(() => {

        box.innerHTML = original;

        box.classList.remove("copied");

    }, 900);

}
